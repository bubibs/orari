<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Utenti - Orari TS</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Importazioni script richieste -->
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1 onclick="app.navigate('home')" style="cursor: pointer;">
                    <i class="ph ph-shield-check"></i>
                    Gestione Utenti
                </h1>
                <button class="btn btn-icon-only" onclick="app.goBack()" title="Torna indietro">
                    <i class="ph ph-arrow-left"></i>
                </button>
            </div>
        </header>

        <main id="main-content">
            <div class="fade-in" id="user-management-view">
                <div id="loading-state" class="text-center" style="padding:40px 0;">
                    <i class="ph ph-spinner ph-spin" style="font-size:2rem; color:var(--primary);"></i>
                    <p style="color:var(--text-muted); margin-top:10px;">Caricamento utenti...</p>
                </div>

                <div id="users-container" style="display:none;">
                    <div id="users-list" class="card" style="margin-bottom:20px;">
                        <!-- Lista utenti verrà renderizzata qui -->
                    </div>

                    <div id="sync-status" class="card" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:14px; margin-bottom:20px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <i class="ph ph-arrow-clockwise text-gold" id="sync-icon"></i>
                                <span id="sync-text">Sincronizza con Cloud</span>
                            </div>
                            <button id="sync-btn" class="btn btn-sm btn-primary" onclick="app.syncUsersFromCloud()">
                                Aggiorna Utenti
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>
</body>
</html>
